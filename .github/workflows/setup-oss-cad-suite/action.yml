name: Setup OSS CAD Suite

inputs:
  version:
    description: 'version to install'
    required: false
    default: '2026-02-03'

runs:
  using: composite
  steps:
    - id: cache-oss-cad-suite
      uses: actions/cache/restore@v6
      with:
        path: oss-cad-suite
        key: oss-cad-suite-${{ runner.os }}-${{ inputs.version }}

    - shell: bash
      if: steps.cache-oss-cad-suite.outputs.cache-hit != 'true'
      run: |
        VERSION=${{ inputs.version }}
        ARTIFACT=oss-cad-suite-linux-x64-$(echo $VERSION | tr -d '-')
        wget -q -O - https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${VERSION}/${ARTIFACT}.tgz | tar -zx

    # Seed the cache on the default branch so pull requests can reuse it.
    - if: steps.cache-oss-cad-suite.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/save@v6
      with:
        path: oss-cad-suite
        key: ${{ steps.cache-oss-cad-suite.outputs.cache-primary-key }}

    # Add the CAD Suite to the PATH
    - shell: bash
      run: echo "$(pwd)/oss-cad-suite/bin" >> $GITHUB_PATH

