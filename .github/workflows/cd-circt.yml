name: 'CD (firtool)'

on:
  workflow_dispatch:
  # Run every 15 minutes.
  schedule:
    - cron: '*/15 * * * *'

jobs:
  cd-circt:
    name: 'Check Version, Create PR'
    runs-on: ubuntu-24.04
    steps:
      - name: 'circt/update-circt'
        uses: circt/update-circt@704ce8eec2c65595438d212c063eeefc7f15f5e2 # v1.1.3
        with:
          user: chiselbot
          email: chiselbot@users.noreply.github.com
          pr-labels: |
            Dependency Update
          pr-reviewers: |
            seldridge
            jackkoenig
          should-create-pr: '.github/scripts/check-github-for-firtool-assets.sh'
          github-token: ${{ secrets.CHISEL_BOT_TOKEN }}
